<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lost & Found Portal</title>
    <!-- Google Fonts for better typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold" href="#">
          <span class="fs-4">🔍 Lost & Found</span>
        </a>
      </div>
    </nav>

    <div class="container py-5">
      <div class="row g-4">
        
        <!-- LEFT COLUMN: Submission Form (Sticky on Desktop) -->
        <div class="col-lg-4">
          <div class="card form-card sticky-top-custom">
            <div class="card-body">
              <h5 class="card-title mb-4 fw-bold text-primary">Report an Item</h5>
              
              <form id="itemForm" autocomplete="off">
                <!-- Name -->
                <div class="form-floating mb-3">
                  <input type="text" class="form-control" id="name" placeholder="John Doe" required />
                  <label for="name">Your Name</label>
                </div>

                <!-- Email -->
                <div class="form-floating mb-3">
                  <input type="email" class="form-control" id="email" placeholder="name@example.com" required />
                  <label for="email">Email Address</label>
                </div>

                <!-- Item Name -->
                <div class="form-floating mb-3">
                  <input type="text" class="form-control" id="itemName" placeholder="Blue Umbrella" required />
                  <label for="itemName">Item Name</label>
                </div>

                <!-- Description -->
                <div class="form-floating mb-3">
                  <textarea class="form-control" id="description" placeholder="Description" style="height: 100px" required></textarea>
                  <label for="description">Description</label>
                </div>

                <!-- Type Select -->
                <div class="form-floating mb-3">
                  <select id="type" class="form-select" required>
                    <option value="" selected disabled>Select status...</option>
                    <option value="Lost">Lost (I lost something)</option>
                    <option value="Found">Found (I found something)</option>
                  </select>
                  <label for="type">Status</label>
                </div>

                <!-- Location -->
                <div class="form-floating mb-3">
                  <input type="text" class="form-control" id="location" placeholder="Library" />
                  <label for="location">Location (Optional)</label>
                </div>

                <!-- Date -->
                <div class="form-floating mb-4">
                  <input type="date" class="form-control" id="date" max="" required />

                  <label for="date">Date</label>
                </div>

                <!-- Buttons -->
                <div class="d-grid gap-2">
                  <button type="submit" class="btn btn-primary btn-lg shadow-sm">Submit Post</button>
                  <button type="reset" class="btn btn-light text-muted btn-sm">Clear Form</button>
                </div>
              </form>
            </div>
          </div>
        </div>

        <!-- RIGHT COLUMN: Items Feed -->
        <div class="col-lg-8">
          <!-- Search/Filter Bar -->
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold m-0 text-secondary">Recent Posts</h4>
            <div class="input-group w-50 d-none d-md-flex">
              <span class="input-group-text bg-white border-end-0">🔎</span>
              <input type="text" id="searchInput" class="form-control border-start-0 ps-0" placeholder="Search items...">
            </div>
          </div>

          <!-- Items Container -->
          <div id="itemsList" class="row row-cols-1 row-cols-md-2 g-3">
            <!-- Items will be injected here by app.js -->
            <!-- Example Skeleton for visualization (Removed when JS loads) -->
            <div class="col text-center text-muted py-5 d-none" id="loadingMsg">
              Loading items...
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
    <!-- Add simple search script at the bottom -->
    <script>
      // Simple client-side search filter
      document.getElementById('searchInput')?.addEventListener('keyup', function(e) {
        const term = e.target.value.toLowerCase();
        const cards = document.querySelectorAll('.item-col'); // Assumes JS adds class 'item-col'
        cards.forEach(card => {
          const text = card.textContent.toLowerCase();
          card.style.display = text.includes(term) ? '' : 'none';
        });
      });
    </script>
  </body>
</html>
